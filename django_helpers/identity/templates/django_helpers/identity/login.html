{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% trans "Sign in" %}</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f5; padding: 1rem; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 2rem; width: 100%; max-width: 400px; }
        h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
        .subtitle { color: #666; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input[type="email"], input[type="text"] { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        input[type="email"]:focus, input[type="text"]:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 3px rgba(0,102,204,0.2); }
        button { width: 100%; padding: 0.75rem; background: #0066cc; color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 500; cursor: pointer; }
        button:hover { background: #0052a3; }
        button:focus { outline: none; box-shadow: 0 0 0 3px rgba(0,102,204,0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { background: #fee; color: #c00; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.875rem; }
        .divider { display: flex; align-items: center; margin: 1.5rem 0; color: #999; font-size: 0.875rem; }
        .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid #ddd; }
        .divider span { padding: 0 1rem; }
        .passkey-btn { background: #333; }
        .passkey-btn:hover { background: #1a1a1a; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    </style>
</head>
<body>
    <main class="card" role="main">
        <h1>{% trans "Sign in" %}</h1>
        <p class="subtitle">{% trans "Enter your email to receive a sign-in code" %}</p>

        {% if error %}
        <div class="error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'identity:login' %}" novalidate>
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'' }}">
            <div class="form-group">
                <label for="id_email">{% trans "Email address" %}</label>
                <input type="email" name="email" id="id_email" autocomplete="email" required autofocus>
            </div>
            <button type="submit">{% trans "Email me a code" %}</button>
        </form>

        {% if passkey_enabled %}
        <div class="divider"><span>{% trans "or" %}</span></div>
        <div>
            <button type="button" class="passkey-btn" id="passkey-login-btn"
                    data-options-url="{% url 'identity:passkey_auth_options' %}"
                    data-verify-url="{% url 'identity:passkey_auth_verify' %}">
                {% trans "Sign in with a passkey" %}
            </button>
            <p id="passkey-error" class="error" role="alert" hidden></p>
        </div>
        {% endif %}

        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: #666;">
            <a href="{% url 'identity:passkeys' %}" style="color: #0066cc;">{% trans "Manage passkeys" %}</a>
        </p>
    </main>

    <script src="{% static 'django_helpers/identity/passkeys.js' %}" defer></script>
</body>
</html>
