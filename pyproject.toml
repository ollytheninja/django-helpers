[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-helpers"
version = "0.1.0"
description = "Reusable, deliberately small building blocks for Django projects"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Olly Ewert", email = "olly@teapot.nz" },
]
dependencies = [
    "django>=5.1",
]

classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
passkeys = ["webauthn>=2.2,<4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.9",
    "webauthn>=2.2,<4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.uv]
default-groups = ["dev"]
